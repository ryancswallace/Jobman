---
name: Publish Linux packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to publish or repair (for example, v1.2.3)
        required: true
        type: string

concurrency:
  group: jobman-cloudsmith
  cancel-in-progress: false

permissions: read-all

jobs:
  publish:
    name: Publish verified Linux packages to Cloudsmith
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: main
      url: https://cloudsmith.io/~jobman/repos/stable/

    steps:
      - name: Checkout trusted publication logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Authenticate to Cloudsmith with API key
        uses: cloudsmith-io/cloudsmith-cli-action@db783de9f6e7a445e5e31d94f4210303b48a10a3 # v3.0.1
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          cli-version: 1.21.0
          verify-auth: "true"

      - name: Publish verified Linux packages
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./devel/publish-cloudsmith-packages.sh "${{ inputs.tag }}"
