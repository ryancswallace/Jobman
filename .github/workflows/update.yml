---
name: Repository maintenance

on:
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: repository-maintenance
  cancel-in-progress: true

jobs:
  update:
    name: Update generated repository files
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Select maintenance run
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          if [[ "${EVENT_NAME}" != "workflow_run" ]]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          published=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/jobs?filter=latest&per_page=100" \
            --jq 'any(.jobs[]; .name == "Publish complete release" and .conclusion == "success")')
          echo "run=${published}" >> "${GITHUB_OUTPUT}"
          if [[ "${published}" != "true" ]]; then
            echo "The completed Release run did not publish a release; maintenance is not required."
          fi

      - name: Checkout
        if: steps.decision.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Release metadata synchronization needs the complete semantic-tag
          # history. workflow_run data is never used as a checkout ref.
          fetch-depth: 0

      - name: Set up Go
        if: steps.decision.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.version
          check-latest: true
          cache-dependency-path: go.sum

      - name: Run repository maintenance
        if: steps.decision.outputs.run == 'true'
        run: make update-all

      - name: Validate changes
        if: steps.decision.outputs.run == 'true'
        run: make quick-check release-metadata-check notices-check

      - name: Publish maintenance review branch
        if: steps.decision.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Repository maintenance produced no changes." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          branch=automation/repository-maintenance
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "${branch}"
          git add --all
          git commit -m "chore: run repository maintenance"
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            expected=$(git rev-parse "refs/remotes/origin/${branch}")
            git push --force-with-lease="refs/heads/${branch}:${expected}" \
              origin "HEAD:refs/heads/${branch}"
          else
            git push origin "HEAD:refs/heads/${branch}"
          fi
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          {
            echo "### Repository maintenance is ready for review"
            echo
            echo "Create and review the maintenance pull request: ${compare_url}"
          } >> "${GITHUB_STEP_SUMMARY}"
